<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Trang Chủ - GraphQL & AJAX</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container">
			<a class="navbar-brand fw-bold" href="/">🛍️ GraphQL Shop</a>
			<div>
				<!-- Thêm nút sang trang Category -->
				<a href="/admin-category" class="btn btn-success btn-sm me-2">Quản
					lý Category</a> <a href="/admin" class="btn btn-warning btn-sm">Quản
					lý Sản phẩm</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<div class="row mb-4">
			<div class="col-12 text-center">
				<h2 class="fw-bold text-primary mb-3">Sản phẩm nổi bật</h2>
				<!-- Bộ lọc Category sẽ được AJAX đổ vào đây -->
				<div id="category-filters"
					class="d-flex justify-content-center flex-wrap gap-2">
					<!-- Nút mặc định theo yêu cầu 1: Sắp xếp giá từ thấp đến cao -->
				</div>
			</div>
		</div>

		<!-- Danh sách sản phẩm -->
		<div class="row" id="product-list">
			<!-- Dữ liệu AJAX sẽ đổ vào đây -->
		</div>
	</div>

	<script>
    // Hàm dùng chung để gọi GraphQL API
    function fetchGraphQL(query) {
        return $.ajax({
            url: '/graphql',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query })
        });
    }

    // 1. Tải bộ lọc Danh mục
    function loadCategories() {
        const query = `
            query {
                getAllCategories {
                    categoryId
                    categoryName
                }
            }
        `;
        
        fetchGraphQL(query).done(function(res) {
            // Khởi tạo nút mặc định (Yêu cầu 1 của đề)
            let btns = `<button class="btn btn-primary" onclick="loadProductsSortedByPrice()">Tất cả (Giá tăng dần)</button>`;
            
            // Render các nút category (Yêu cầu 2 của đề)
            res.data.getAllCategories.forEach(c => {
                btns += `<button class="btn btn-outline-primary" onclick="loadProductsByCategory(${c.categoryId})">${c.categoryName}</button>`;
            });
            $('#category-filters').html(btns);
        });
    }

    // Hàm dùng chung để render giao diện Sản phẩm
    function renderProducts(products) {
        let html = '';
        if(products.length === 0) {
            html = `<div class="col-12 text-center text-muted mt-5"><h5>Không có sản phẩm nào trong danh mục này.</h5></div>`;
        } else {
            products.forEach(p => {
                // Xử lý ảnh: nếu có ảnh thì gọi từ uploads/, không thì lấy ảnh mặc định
                let img = p.images ? `/uploads/${p.images}` : 'https://via.placeholder.com/300x200?text=No+Image';
                
                html += `
                <div class="col-md-3 mb-4">
                    <div class="card h-100 shadow-sm border-0">
                        <img src="${img}" class="card-img-top" style="height: 200px; object-fit: cover;">
                        <div class="card-body text-center">
                            <h5 class="card-title text-dark fw-bold">${p.productName}</h5>
                            <p class="card-text text-danger fw-bold fs-5">${p.unitPrice.toLocaleString('vi-VN')} đ</p>
                        </div>
                    </div>
                </div>`;
            });
        }
        $('#product-list').html(html);
    }

    // 2. [Yêu cầu đề bài]: Hiển thị sản phẩm giá từ thấp đến cao
    function loadProductsSortedByPrice() {
        const query = `
            query {
                getProductsSortedByPrice {
                    productId
                    productName
                    unitPrice
                    images
                }
            }
        `;
        fetchGraphQL(query).done(function(res) {
            renderProducts(res.data.getProductsSortedByPrice);
        });
    }

    // 3. [Yêu cầu đề bài]: Lấy tất cả product của 01 category
    function loadProductsByCategory(id) {
        const query = `
            query {
                getProductsByCategoryId(categoryId: ${id}) {
                    productId
                    productName
                    unitPrice
                    images
                }
            }
        `;
        fetchGraphQL(query).done(function(res) {
            renderProducts(res.data.getProductsByCategoryId);
        });
    }

    // Khi trang vừa load xong thì gọi 2 hàm khởi tạo
    $(document).ready(function() {
        loadCategories();
        loadProductsSortedByPrice(); // Mặc định vừa vào web là hiện sản phẩm giá tăng dần
    });
</script>

</body>
</html>
