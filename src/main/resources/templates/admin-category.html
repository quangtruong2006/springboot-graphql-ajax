<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Trị Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container-fluid px-5">
        <a class="navbar-brand fw-bold" href="/admin-category">📁 Quản lý Category</a>
        <div>
            <a href="/admin" class="btn btn-danger btn-sm me-2">Quản lý Sản Phẩm</a>
            <a href="/" class="btn btn-light btn-sm">Về Trang Chủ</a>
        </div>
    </div>
</nav>

<div class="container px-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <h4 class="mb-0 text-success fw-bold">Danh sách Danh mục (Phân trang)</h4>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCategory" onclick="openAddModal()">+ Thêm Danh mục</button>
        </div>
        <div class="card-body">
            <table id="categoryTable" class="table table-bordered table-hover align-middle text-center w-100">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Icon</th>
                        <th>Tên Danh Mục</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="category-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL THÊM / SỬA -->
<div class="modal fade" id="modalCategory" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="modalTitle">Thêm Danh Mục</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formCategory">
            <input type="hidden" id="catId">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên Danh Mục</label>
                <input type="text" class="form-control" id="catName" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Icon (Hình ảnh)</label>
                <input type="file" class="form-control" id="catIconFile" accept="image/*">
                <input type="hidden" id="catIconHidden" value="default.jpg">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        <button type="button" class="btn btn-success" onclick="saveCategory()">Lưu dữ liệu</button>
      </div>
    </div>
  </div>
</div>

<script>
    let globalCategories = [];
    let isEditMode = false;

    function fetchGraphQL(query, variables = {}) {
        return $.ajax({
            url: '/graphql',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query, variables: variables })
        });
    }

    function loadCategories() {
        const q = `query { getAllCategories { categoryId categoryName icon } }`;
        fetchGraphQL(q).done(res => {
            globalCategories = res.data.getAllCategories;
            let html = '';
            globalCategories.forEach(c => {
                let img = c.icon ? `/uploads/${c.icon}` : 'https://via.placeholder.com/50';
                html += `
                    <tr>
                        <td class="fw-bold">${c.categoryId}</td>
                        <td><img src="${img}" width="50" height="50" style="object-fit:cover; border-radius:5px;"></td>
                        <td class="text-primary fw-bold">${c.categoryName}</td>
                        <td>
                            <button class="btn btn-warning btn-sm me-1" onclick="openEditModal(${c.categoryId})">Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.categoryId})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
            
            let table = $('#categoryTable').DataTable();
            table.destroy(); 
            $('#category-tbody').html(html);
            $('#categoryTable').DataTable({ language: { search: "🔍 Tìm kiếm:" } });
        });
    }

    function openAddModal() {
        isEditMode = false;
        $('#modalTitle').text("Thêm Danh Mục");
        $('#formCategory')[0].reset();
        $('#catIconHidden').val("default.jpg");
    }

    function openEditModal(id) {
        isEditMode = true;
        $('#modalTitle').text("Cập nhật Danh Mục");
        let c = globalCategories.find(x => x.categoryId == id);
        if(c) {
            $('#catId').val(c.categoryId);
            $('#catName').val(c.categoryName);
            $('#catIconFile').val('');
            $('#catIconHidden').val(c.icon || "default.jpg");
            $('#modalCategory').modal('show');
        }
    }

    async function saveCategory() {
        let finalIconName = $('#catIconHidden').val(); 
        let fileInput = $('#catIconFile')[0].files[0];

        // Tái sử dụng API upload cũ cực mượt
        if(fileInput) {
            let formData = new FormData();
            formData.append("file", fileInput);
            finalIconName = await $.ajax({ url: '/upload', type: 'POST', data: formData, processData: false, contentType: false });
        }

        let payload = {
            categoryName: $('#catName').val(),
            icon: finalIconName
        };

        let mutationQuery = "";
        if(isEditMode) {
            payload.categoryId = $('#catId').val();
            mutationQuery = `mutation UpdateCat($input: CategoryInput!) { updateCategory(category: $input) { categoryId } }`;
        } else {
            mutationQuery = `mutation CreateCat($input: CategoryInput!) { createCategory(category: $input) { categoryId } }`;
        }

        fetchGraphQL(mutationQuery, { input: payload }).done(() => {
            $('#modalCategory').modal('hide');
            loadCategories(); 
        });
    }

    function deleteCategory(id) {
        if(confirm("Xóa danh mục này nhé?")) {
            fetchGraphQL(`mutation { deleteCategory(categoryId: ${id}) }`).done(() => loadCategories());
        }
    }

    $(document).ready(() => loadCategories());
</script>

</body>
</html>
