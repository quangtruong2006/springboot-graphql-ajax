spring.application.name=springboot-graphql-ajax
server.port=8090

# Cấu hình kết nối SQL Server (Trỏ vào database webst4)
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS01;databaseName=webst4;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA tự động tạo bảng
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# CẤU HÌNH THƯ MỤC GỐC CHỨA FILE JSP
# ===============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Bật giao diện test GraphQL
spring.graphql.graphiql.enabled=true
# Tang gioi han upload file len 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB